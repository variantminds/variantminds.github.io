
# Generated by Jekyll from _data/htaccess.yml. Do not edit the deployed copy.
# nginx needs a map at the http level. Include this file inside the http { } block:
#   include /path/to/site/nginx-http.conf;
# The variable name contains the site host, so several sites can share one server.

# ----- Expire (browser caching) times by content type -----
# Uses only the first "<number> <unit>" of each 'keep' value.
map $sent_http_content_type $ts_expires_variantminds_au {
  default 2d;
  "~^image/jpg(;|$)" 1M;
  "~^image/svg[+]xml(;|$)" 1M;
  "~^image/gif(;|$)" 1M;
  "~^image/jpeg(;|$)" 1M;
  "~^image/png(;|$)" 1M;
  "~^video/mp4(;|$)" 1y;
  "~^video/mpeg(;|$)" 1y;
  "~^text/css(;|$)" 1M;
  "~^text/javascript(;|$)" 1M;
  "~^application/javascript(;|$)" 1M;
  "~^image/ico(;|$)" 1M;
  "~^image/x-icon(;|$)" 1M;
  "~^application/pdf(;|$)" 1M;
  "~^text/xml(;|$)" 1M;
  "~^application/manifest[+]json(;|$)" 1M;
  "~^text/plain(;|$)" 1M;
  "~^text/html(;|$)" 3600s;
}
