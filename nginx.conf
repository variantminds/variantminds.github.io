
# Generated by Jekyll from _data/htaccess.yml. Do not edit the deployed copy.
# nginx equivalent of .htaccess. Include it inside your server { } block:
#   include /path/to/site/nginx.conf;
# Also include nginx-http.conf in the http { } block.
# After each deploy: nginx -t && nginx -s reload

# Do not serve these configuration files
location ~ ^/(nginx|nginx-http)\.conf$ { return 404; }

# turn off directory browsing
autoindex off;

# show custom error pages for these HTTP statuses
error_page 404 /404.html;

# ----- Begin redirection headers -----
# static pages
location ~ ^/contact/?$ { return 308 /about/contact.html; }

location ~ ^/feed/?$ { return 303 /feed.xml; }
location ~ ^/contact/$ { return 302 /about/contact.html; }

# Example: Make .php files appear as .html, if the .php file does not exist
if (!-f $request_filename) {
  rewrite (?i)^(.+)\.php$ $1.html last;
}

# ----- Begin GZIP headers -----
gzip on;
gzip_vary on;
gzip_types
  image/svg+xml
  application/javascript
  application/rss+xml
  application/vnd.ms-fontobject
  application/x-font
  application/x-font-opentype
  application/x-font-otf
  application/x-font-truetype
  application/x-font-ttf
  application/x-javascript
  application/xhtml+xml
  application/xml
  font/opentype
  font/otf
  font/ttf
  image/x-icon
  text/css
  text/javascript
  text/plain
  text/xml;

# ----- Begin Expire (browser caching) headers -----
# $ts_expires_variantminds_au is set by the map in nginx-http.conf
expires $ts_expires_variantminds_au;

add_header Access-Control-Allow-Origin "*";
add_header Access-Control-Allow-Methods "GET";
add_header Access-Control-Allow-Headers "Content-Type";
